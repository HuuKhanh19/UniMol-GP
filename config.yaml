# UniMol-GP -- default hyperparameters.
#
# Loaded into the argparse defaults of scripts/run_step1.py, so precedence is:
#     CLI flag  >  this file  >  the default declared in add_argument()
#
# Every key must match an argparse destination (see run_step1.py --help); an
# unknown key aborts the run instead of being silently ignored. Delete a key to
# fall back to the script default.

# Data split
split_seed: 0

# Featurisation
# false -> keep every hydrogen, load mol_pre_all_h_220816.pt  (this project)
# true  -> strip hydrogens, load mol_pre_no_h_220816.pt
remove_hs: false

# Training
epochs: 100
batch_size: 32
learning_rate: 0.0001
patience: 10

# Hardware
gpu_id: 0
